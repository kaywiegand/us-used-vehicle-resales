# Slide-Registry — Single Source of Truth für Overview/StoryView/TechView
#
# Schema wie zh-tram-flow (Gold Standard): chapters -> slides -> content-items.
# StoryView ist die vollständigste Erzählung; Overview/TechView leiten per
# Wiederverwendung ab (views-Liste je Slide) oder haben eine eigene, kompaktere
# Variante (TechView fasst Results/Empfehlungen/Learnings zusammen, Kay-Entscheidung
# 2026-07-09 — sonst wirkt die Präsentation insgesamt zu tech-lastig).
#
# Content-Typen ohne Renderer (nicht verwenden): findings, note.

chapters:

  # ---------------------------------------------------------------------
