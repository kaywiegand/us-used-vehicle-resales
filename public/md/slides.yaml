  # ---------------------------------------------------------------------
  # Eigenes Kapitel für Problem/Zielmetrik (vorher Teil von "einstieg"), damit es als
  # "Einstieg" in der Agenda auftaucht — analog zh-tram-flows "Ausgangssituation" als
  # separates Kapitel nach Titel+Agenda (Kay-Feedback 2026-07-17).
  - id: problem
    nav_label: Ausgangssituation
    slides:
      - id: einstieg-problem
        views: [overview, storyview, techview]
        title: "Die Herausforderung"
        subtitle: "Ein Fehlkauf beim Gebrauchtwagen-Ankauf kostet mehr als den Kaufpreis"
        content:
          - type: statement
            sentiment: neutral
            text: "Ein US-Gebrauchtwagenhändler kauft Fahrzeuge günstig auf Auktionen ein, um sie mit Marge weiterzuverkaufen. Das größte Risiko: ein 'Bad Buy' — ein Fahrzeug mit schweren Mängeln, das sich nicht weiterverkaufen lässt und stattdessen Lager-, Reparatur- und Abschreibungskosten verursacht."
          - type: statement
            sentiment: warning
            text: "Leitfrage: Lässt sich vor dem Kauf erkennen, ob ein Angebot ein Fehlkauf ist — ohne zu viele gute Autos abzulehnen? Das ist ein Precision/Recall-Abwägungsproblem auf einer seltenen Zielklasse, kein Accuracy-Problem."

      - id: einstieg-aufgabe
        views: [overview, storyview, techview]
        title: "Zielmetrik und Trade-off"
        subtitle: "Warum Accuracy hier die falsche Metrik ist"
        content:
          - type: figures_with_context
            items:
              - value: "12,35 %"
                label: "Bad-Buy-Rate\nim Datensatz"
                sentiment: warning
                context: "Nur jedes achte Auto ist ein Fehlkauf — eine stark unausgewogene Zielklasse."
              - value: "87,65 %"
                label: "Accuracy eines\nStumpfen Modells"
                sentiment: negative
                context: "Ein Modell, das stur immer 'guter Kauf' tippt, hätte schon 87,65 % Accuracy — und würde trotzdem keinen einzigen Fehlkauf erkennen."
              - value: "F1"
                label: "Leitmetrik\n(Bad-Buy-Klasse)"
                sentiment: positive
                context: "F1 der Bad-Buy-Klasse zwingt das Modell, die seltene Klasse tatsächlich zu treffen statt sie zu ignorieren."
          - type: statement
            sentiment: neutral
            layout: wide
            text: "<span class=\"sw-normal\">Triage statt Automatik.</span><br><span class=\"sw-thin\">Das Modell markiert Auffälligkeiten zur menschlichen Prüfung – kein automatisches Ablehnen oder Durchwinken.</span>"

  # ---------------------------------------------------------------------
  - id: daten
    nav_label: Data & Exploration
    nav_label_by_view:
      techview: Datenstrategie
    slides:
      - id: daten-cleaning
        views: [storyview, techview]
        title: "Dataset & Cleaning"
        subtitle: "65.620 Fahrzeuge, 33 Rohspalten — nichts gelöscht, alles aufgefüllt"
        content:
          - type: h_timeline
            items:
              - label: "Datensatz"
                text: "65.620 Trainings-Fahrzeuge, 33 Rohspalten — stratifizierter Split 52.496 Train / 13.124 Test"
              - label: "Bereinigt"
                text: "106.348 kategoriale Lücken mit 'Unknown' aufgefüllt, 621 unplausible Werte über Gruppen-Median-Imputation geheilt"
              - label: "Ergebnis"
                text: "0 Zeilen gelöscht — 100 % Retention Rate, jedes Auto bleibt im Datensatz"

      - id: daten-imbalance
        views: [overview, storyview, techview]
        title: "Class Imbalance"
        subtitle: "12,35 % Bad Buys — Balance als Kern der Herausforderung"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "Klassenverteilung IsBadBuy"
                source: target_distribution
                caption: "57.516 gute Käufe (87,65 %) vs. 8.104 Bad Buys (12,35 %).<br><br>Ein Modell, das immer 'guter Kauf' tippt, hätte 87,65 % Accuracy und würde trotzdem keinen einzigen Fehlkauf finden — deshalb ist F1 der Bad-Buy-Klasse die Leitmetrik, nicht Accuracy."

      - id: daten-risk-analyse
        views: [overview, storyview, techview]
        title: "Bivariate Risk-Analyse"
        subtitle: "Text-Spalten ohne offensichtlichen Zahlenwert sind die stärksten Risikotreiber"
        content:
          - type: contrasts
            items:
              - assumption: "Trim, SubModel, VNZIP1 wirken wie reiner Text ohne mathematischen Wert"
                finding: "Bivariate Analyse zeigt: seltene Ausprägungen dieser Spalten haben eine stark überproportionale Fehlkaufquote — 'High-Risk-Nischen', die Expertenwissen bündeln (Standort, Bauart-Qualität, Serien-Ruf), das in nackten Zahlen wie VehBCost fehlt."
              - assumption: "Nur numerische Werte (Preis, Alter, Kilometerstand) sind aussagekräftig"
                finding: "Diese Hypothese rechtfertigt später die Aufnahme der starken Kategorien (Make, Model, Trim, SubModel, VNZIP1, Auction, WheelType) in den Feature-Katalog — und wird durch die systematische Testreihe bestätigt (Kapitel 3–4)."

      - id: daten-preis-korrelation
        views: [storyview, techview]
        title: "Preis-Korrelation → Feature Engineering"
        subtitle: "8 redundante MMR-Preisspalten werden zu 3 Verhältnis-Features verdichtet"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "Korrelation der Preis-Features"
                source: feature_correlations
                caption: "Die MMR-Preisfamilie (Einkauf/Aktuell × Auktion/Handel × Schnitt/Clean) ist stark untereinander korreliert — die 8 rohen Preis-Spalten sagen im Grunde alle dasselbe. Schlussfolgerung: 3 verdichtete Verhältnis-Features statt 8 Rohspalten — feat_price_ratio (Einkaufspreis vs. Marktpreis), feat_price_diff (Abweichung), feat_market_trend (Marktpreis-Entwicklung seit Einkauf)."

  # ---------------------------------------------------------------------
  - id: experimentieren
    nav_label: Systematisches Experimentieren
    slides:
      - id: experimentieren-infrastruktur
        views: [storyview, techview]
        title: "Feature-Katalog & Model-Katalog"
        subtitle: "19 Feature-Sets × 6 Modellfamilien statt Ad-hoc-Training"
        content:
          - type: steps
            items:
              - step: "1"
                label: "Feature-Katalog bauen"
                detail: "19 Sets nach Risiko-Hypothese, von baseline_minimal (4 Feat.) bis all_in_with_noise (28 Feat.)"
              - step: "2"
                label: "Model-Katalog bauen"
                detail: "3 Lernprinzipien × 2 Ausbaustufen: LogReg Ridge/Lasso, Random Forest flach/tief, HistGradientBoosting Standard/aggressiv"
              - step: "3"
                label: "Kreuzen & Loggen"
                detail: "Jedes Feature-Set gegen jedes Modell — der ModelTracker protokolliert automatisch jede Kombination"

      - id: experimentieren-modeltracker
        views: [storyview, techview]
        title: "Der ModelTracker"
        subtitle: "Selbstgebauter Experiment-Logger statt manuellem Vergleich"
        content:
          - type: statement
            layout: lead_copy
            text: "Kombinationen aus Model- und Feature-Kataloge"
            copy: "Pro Durchlauf werden F1, Recall, Precision und ROC-AUC in eine dauerhafte CSV geschrieben. Ein neuer Bestwert wird automatisch markiert. Das Modell selbst wird nur bei Bestwert oder F1 ≥ 0,30 exportiert ('Smart Export') — kein Datenmüll durch schwache Modelle."

      - id: experimentieren-testreihe-figures
        views: [overview, storyview, techview]
        title: "Die Testreihe"
        subtitle: "448 protokollierte Durchläufe in rund einer Stunde aktiver Rechenzeit"
        content:
          - type: figures
            items:
              - {value: "448", label: "geloggte Durchläufe (19 Feature-Sets × 6 Modellfamilien)", sentiment: neutral}
              - {value: "3 Sek.", label: "Median-Abstand zwischen Durchläufen", sentiment: positive}
              - {value: "~62 Min.", label: "aktive Rechenzeit für alle 448 Durchläufe zusammen", sentiment: positive}
          - type: statement
            sentiment: positive
            layout: wide
            text: "Nach einer Stunde Wartezeit steht sofort eine auswertbare Tabelle mit allen 448 Kombinationen zur Verfügung."

      - id: experimentieren-testreihe-chart
        views: [storyview, techview]
        title: "Benchmark der Testreihe"
        subtitle: "Top-10 von 448 Durchläufen nach F1"
        content:
          - type: chart_refs
            items:
              - label: "Top-10-Durchläufe nach F1"
                source: model_comparison_t10
                caption: "Die 10 stärksten von 448 protokollierten Kombinationen aus Feature-Set und Modell."

  # ---------------------------------------------------------------------
  - id: findings
    nav_label: Key Findings
    slides:
      - id: findings-breiter-katalog
        views: [storyview, techview]
        title: "Breiter Katalog schlägt Handpicking"
        subtitle: "Kategoriale Signale sind kein Rauschen, sondern der Haupthebel"
        content:
          - type: comparison_table
            columns: ["Feature-Set", "Features", "Bester F1 (Tracker)"]
            rows:
              - cells: ["numeric — nur Zahlen (Preis, Alter, Kilometerstand)", "6", "0,2918"]
                highlight: false
              - cells: ["all_in_with_noise — voller Katalog inkl. Kategorien", "28", "0,3726"]
                highlight: true
          - type: statement
            layout: lead_copy
            text: "Noise mit wichtigem Informationsgehalt"
            copy: "Der Unterschied hält über mehrere Modellfamilien hinweg — kein Zufallstreffer. In die Breite zu gehen, statt vorab nach vermuteter Wichtigkeit auszuwählen, war der entscheidende Schritt — nicht ein bestimmter Algorithmus."

      - id: findings-wheeltype-chart
        views: [overview, storyview, techview]
        title: "Der WheelType-Fund"
        subtitle: "Das stärkste Signal ist ein fast leeres Datenfeld"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "LogReg-Lasso Feature Importance"
                source: logreg_feature_importance
                caption: "WheelType = Unknown dominiert die Koeffizienten des Champion-Modells — vor Preis und Alter."

      - id: findings-wheeltype-table
        views: [storyview, techview]
        title: "Der WheelType-Fund"
        subtitle: "95,6 % unauffällig gefüllt, aber die fehlenden 4,4 % sind der Alarm"
        content:
          - type: comparison_table
            columns: ["WheelType-Wert", "Anteil der Autos", "Fehlkaufquote"]
            rows:
              - cells: ["Alloy (Alufelgen)", "49,3 %", "11,1 %"]
                highlight: false
              - cells: ["Covers (Radkappen)", "45,3 %", "8,1 %"]
                highlight: false
              - cells: ["Special", "1,0 %", "12,6 %"]
                highlight: false
              - cells: ["Fehlt (leer)", "4,4 %", "70,3 %"]
                highlight: true
              - cells: ["Durchschnitt (alle Autos)", "—", "12,3 %"]
                highlight: false
          - type: statement
            sentiment: positive
            layout: wide
            text: "Ein in 95,6 % der Fälle unauffälliges Feld wird in den restlichen 4,4 % zum stärksten Alarmsignal."

      - id: findings-threshold-chart
        views: [overview, storyview, techview]
        title: "Threshold-Tuning für Business-Balance"
        subtitle: "Der Standard-Schwellenwert markiert zu viele Autos"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "F1 vs. Decision Threshold"
                source: threshold_f1_curve
                caption: "F1-optimaler Schwellenwert bei 0,65 statt Standard 0,5 — abgestimmt auf den Triage-Zweck: Fehlkäufe fangen, ohne zu viele gute Autos abzulehnen."

      - id: findings-threshold-detail
        views: [storyview, techview]
        title: "Threshold-Tuning für Business-Balance"
        subtitle: "F1 0,37 → 0,42 durch den richtigen Schwellenwert"
        content:
          - type: figures
            items:
              - {value: "F1 0,37 → 0,42", label: "Threshold 0,5 → 0,65", sentiment: positive}
              - {value: "Precision 0,45", label: "bei getuntem Threshold", sentiment: neutral}
              - {value: "Recall 0,40", label: "bei getuntem Threshold", sentiment: neutral}
          - type: statement
            sentiment: neutral
            text: "<span class=\"sw-normal\">Ziel: Balance der Triage</span><br><span class=\"sw-thin\">Fehlkäufe blockieren, gute Autos behalten – statt generischem 0,5-Standard.</span>"

  # ---------------------------------------------------------------------
  - id: results
    nav_label: Results & Error Analysis
    slides:
      - id: results-modellvergleich-storyview
        views: [storyview, techview]
        title: "Modellvergleich"
        subtitle: "Alle drei Kandidaten auf demselben Held-out-Test (13.124 Fahrzeuge)"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "Modellvergleich auf dem Test-Set"
                source: model_comparison
                caption: "Baseline F1 0,29 (Recall 0,61/Precision 0,19) · Random Forest F1 0,35 (0,64/0,24) · LogReg Lasso F1 0,37 (0,60/0,27) — Champion."

      - id: results-confusion-matrix-storyview
        views: [storyview, techview]
        title: "Confusion Matrix"
        subtitle: "Beim getunten Threshold 0,65"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - label: "Confusion Matrix, Threshold 0,65"
                source: confusion_matrix
                caption: "643 von 1.621 echten Fehlkäufen erkannt (TP), 978 verpasst (FN), 778 gute Autos fälschlich markiert (FP), 10.725 korrekt durchgewunken (TN)."

      - id: results-robustheit-techview
        views: [techview]
        title: "Robustheits-Checks"
        subtitle: "Ist das Modell sauber, oder wurde geleakt?"
        content:
          - type: figures
            items:
              - {value: "F1 0,409", label: "Champion auf echtem AIM-Holdout (7.292 Fahrzeuge)", sentiment: positive}
              - {value: "~0,01", label: "Lücke intern → echter Holdout", sentiment: positive}
              - {value: "0,003", label: "F1-Delta nach Entfernen von 2.082 memorisierbaren Kategorie-Levels", sentiment: neutral}
          - type: statement
            sentiment: positive
            layout: wide
            text: "<span class=\"sw-normal\">Es gibt kein Leakage.</span><br><span class=\"sw-thin\">Split vor Feature Engineering, keine target-abgeleiteten Features, 0 doppelte Zeilen über den Split hinweg — die Lücke zum echten Holdout ist der stärkste empirische Beleg, dass die internen Zahlen sauber sind.</span>"

      - id: results-blinder-fleck-storyview
        views: [storyview]
        title: "Blinder Fleck — verpasste Fehlkäufe"
        subtitle: "Warum ein Drittel der Bad Buys unentdeckt bleibt"
        content:
          - type: contrasts
            items:
              - assumption: "Erkannte Fehlkäufe (TP)"
                finding: "62,8 % tragen das WheelType-fehlt-Signal — das Modell erkennt sie leicht."
              - assumption: "Verpasste Fehlkäufe (FN)"
                finding: "Nur 0,1 % tragen das WheelType-fehlt-Signal — sie sehen 'sauber' aus, sind im Schnitt $672 teurer und 0,9 Jahre neuer als die erkannten."
          - type: statement
            sentiment: warning
            layout: wide
            text: "Das Modell verlässt sich stark auf ein einziges Signal und hat kein zweites für neuere, teurere Autos, die trotzdem ein Fehlkauf sind."

      - id: results-falsch-markiert-storyview
        views: [storyview]
        title: "Fälschlich markierte gute Autos"
        subtitle: "Der akzeptable Preis eines Triage-Filters"
        content:
          - type: statement
            sentiment: neutral
            text: "<span class=\"sw-normal\">Die zu Unrecht markierten guten Autos (FP) sind im Schnitt $1.740 günstiger und 2,3 Jahre älter als die korrekt durchgewunkenen (TN).</span><br><br><span class=\"sw-thin\">Ein akzeptabler Kompromiss, weil diese Fahrzeuge günstig einzeln nachzuprüfen sind.</span>"

      - id: results-fehlerbild-techview
        views: [techview]
        title: "Fehlerbild — FN/FP-Segmente"
        subtitle: "Blinder Fleck bei verpassten Fehlkäufen, akzeptabler Trade-off bei Fehlalarmen"
        content:
          - type: contrasts
            items:
              - assumption: "Verpasste Fehlkäufe (FN) — 978 Fahrzeuge"
                finding: "Nur 0,1 % WheelType=Unknown (vs. 62,8 % bei erkannten TP), im Schnitt $672 teurer und 0,9 Jahre neuer — Modell hat kein zweites Signal für diesen Fall."
              - assumption: "Fälschlich markierte gute Autos (FP) — 778 Fahrzeuge"
                finding: "Im Schnitt $1.740 günstiger und 2,3 Jahre älter als korrekt durchgewunkene (TN) — akzeptabler Trade-off für einen Triage-Filter, günstig einzeln nachzuprüfen."

  # ---------------------------------------------------------------------
  - id: empfehlungen
    nav_label: Empfehlungen & Opportunities
    slides:
      - id: empfehlungen-storyview-overview
        views: [overview, storyview]
        title: "Empfehlungen"
        subtitle: "Direkt umsetzbar für dieses Projekt"
        content:
          - type: recommendations
            items:
              - category: "R1 · Einsatz"
                title: "Als Triage-Filter, nicht als Automatik"
                points:
                  - "Modell bei Threshold 0,65 laufen lassen, um ~10 % eines Autostapels für menschliche Prüfung zu markieren, bei ~45 % Trefferquote"
                  - "Nicht als automatische Ablehnung nutzen — dafür ist die Genauigkeit nicht hoch genug"
              - category: "R2 · Intake"
                title: "Fehlender WheelType-Eintrag als Warnsignal"
                points:
                  - "Direkt beim Ankauf prüfen — kostet nichts extra, das Feld wird eh schon erfasst"
                  - "Fehlkaufquote bei fehlendem Eintrag: 70,3 % vs. 12,3 % Durchschnitt"

      - id: opportunities-storyview-overview
        views: [overview, storyview]
        title: "Opportunities"
        subtitle: "Konkrete, noch offene nächste Schritte"
        content:
          - type: recommendations
            items:
              - category: "O1 · Modell erweitern"
                title: "Zweites Signal für den blinden Fleck"
                points:
                  - "Ein zweites, unabhängiges Risiko-Merkmal ergänzen (z. B. Abweichung vom Marktpreis)"
                  - "Gezielt für neuere, teurere Fehlkäufe, die aktuell verpasst werden"
              - category: "O2 · Modell vereinfachen"
                title: "Schlankeres 7-Feature-Modell testen"
                points:
                  - "cats_strong (7 Feat.) erreicht F1 0,3587 — 96 % der Leistung des vollen 28-Feature-Katalogs"
                  - "Lohnt einen echten Vergleich: viel einfacheres, leichter wartbares Modell für kaum F1-Verlust"

      - id: empfehlungen-opportunities-techview
        views: [techview]
        title: "Empfehlungen & Opportunities"
        subtitle: "Einsatz heute, offene Schritte für morgen"
        content:
          - type: recommendations
            items:
              - category: "R1 · Einsatz"
                title: "Triage-Filter (Threshold 0,65)"
                points:
                  - "~10 % markiert für Review, ~45 % Precision — kein Auto-Reject"
              - category: "R2 · Intake"
                title: "WheelType=Unknown als Warnsignal"
                points:
                  - "70,3 % Fehlkaufquote bei fehlendem Eintrag vs. 12,3 % Durchschnitt"
              - category: "O1 · Modell erweitern"
                title: "Zweites Signal für den blinden Fleck"
                points:
                  - "Unabhängiges Risiko-Merkmal für neuere/teurere Fehlkäufe (z. B. Marktpreis-Abweichung)"
              - category: "O2 · Modell vereinfachen"
                title: "cats_strong (7 Feat., F1 0,3587) als schlankere Alternative testen"
                points:
                  - "96 % der Leistung des vollen Katalogs mit einem Viertel der Features"

  # ---------------------------------------------------------------------
  - id: learnings
    nav_label: Project Insights
    slides:
      - id: learnings-storyview
        views: [storyview]
        title: "Learnings"
        subtitle: "Methodik-Lehren fürs nächste Projekt — nicht spezifisch für diesen Datensatz"
        content:
          - type: sections
            items:
              - label: "Breites Netz vor Vorauswahl"
                points:
