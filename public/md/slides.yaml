hub:
  headline_kpis_from: einstieg-title-overview
  tagline: "Bad-Buy Prediction | Fehlkäufe vor dem Kauf erkennen"
  subtitle: "Data-Science-Projekt mit 448-Runs-Experimentierframework"
  footer_tagline: "Gebrauchtwagen-Auktionen · Klassifikation"
  about:
    - label: "Motivation"
      text: "Ein US-Gebrauchtwagenhändler kauft Fahrzeuge günstig auf Auktionen ein. Das größte Risiko: ein Fehlkauf, der sich nicht weiterverkaufen lässt. Solch ein Fehlkauf kann extreme Zusatzkosten durch Lagerung, Reparatur und/oder Beseitigung verursachen und sollte möglichst vermieden werden."
    - label: "Kernfrage"
      text: "Ist ein Auto vor dem Kauf als Fehlkauf erkennbar? <strong>Teilweise</strong> — ein systematisch getestetes Modell (448 Läufe über 19 Feature-Sets × 6 Modellfamilien) erreicht F1 0,42 auf der Bad-Buy-Klasse, mit einem überraschenden Top-Signal: ein fehlender WheelType-Eintrag (nur 4,4 % der Fälle) markiert eine Fehlkaufquote von 70,3 % — das Sechsfache des Durchschnitts."
    - label: "Systematisches Experimentieren"
      text: "Ein selbstgebauter ModelTracker protokollierte 448 Durchläufe in rund einer Stunde aktiver Rechenzeit — Feature-Katalog (19 Sets) × Model-Katalog (6 Modellfamilien). Der volle Katalog schlägt reine Zahlen-Features klar (F1 0,29 → 0,37)."
    - label: "Ergebnisse & Empfehlungen"
      text: "Champion: Logistische Regression mit L1-Regularisierung, Threshold getunt auf 0,65 (F1 0,37 → 0,42). Einsatz als Triage-Filter, nicht als Automatik. Error Analysis deckt einen blinden Fleck auf: neuere, teurere Fehlkäufe ohne das WheelType-Signal."
  quick_links:
    - {href: "../notebooks/", label: "Notebooks"}
    - {href: "data-dictionary.html", label: "Data Dictionary"}
  view_order: [overview, techview, storyview]
